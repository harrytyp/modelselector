<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 80" fill="none">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#6366f1" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="divider-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="580" height="80" rx="10" fill="rgba(10,10,25,0.85)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Corner nodes -->
  <circle cx="8" cy="8" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="572" cy="8" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="8" cy="72" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="572" cy="72" r="3" fill="#22d3ee" opacity="0.6"/>

  <!-- Top trace -->
  <path d="M8 8 L40 8" stroke="#22d3ee" stroke-width="0.8" opacity="0.3"/>
  <path d="M540 8 L572 8" stroke="#22d3ee" stroke-width="0.8" opacity="0.3"/>
  <!-- Bottom trace -->
  <path d="M8 72 L40 72" stroke="#22d3ee" stroke-width="0.8" opacity="0.3"/>
  <path d="M540 72 L572 72" stroke="#22d3ee" stroke-width="0.8" opacity="0.3"/>

  <!-- M -->
  <g filter="url(#glow-cyan)">
    <text x="20" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="700" fill="#22d3ee" letter-spacing="-2">M</text>
  </g>

  <!-- o -->
  <g filter="url(#glow-purple)">
    <text x="65" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">o</text>
  </g>

  <!-- d -->
  <g filter="url(#glow-cyan)">
    <text x="105" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#22d3ee" letter-spacing="-2">d</text>
  </g>

  <!-- e -->
  <g filter="url(#glow-purple)">
    <text x="145" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">e</text>
  </g>

  <!-- l -->
  <g filter="url(#glow-cyan)">
    <text x="183" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#22d3ee" letter-spacing="-2">l</text>
  </g>

  <!-- S -->
  <g filter="url(#glow-purple)">
    <text x="215" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="700" fill="#a78bfa" letter-spacing="-2">S</text>
  </g>

  <!-- e -->
  <g filter="url(#glow-cyan)">
    <text x="262" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#22d3ee" letter-spacing="-2">e</text>
  </g>

  <!-- l -->
  <g filter="url(#glow-purple)">
    <text x="300" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">l</text>
  </g>

  <!-- e -->
  <g filter="url(#glow-cyan)">
    <text x="332" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#22d3ee" letter-spacing="-2">e</text>
  </g>

  <!-- c -->
  <g filter="url(#glow-purple)">
    <text x="372" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">c</text>
  </g>

  <!-- t -->
  <g filter="url(#glow-cyan)">
    <text x="412" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#22d3ee" letter-spacing="-2">t</text>
  </g>

  <!-- o -->
  <g filter="url(#glow-purple)">
    <text x="442" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">o</text>
  </g>

  <!-- r -->
  <g filter="url(#glow-purple)">
    <text x="482" y="52" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="400" fill="#a78bfa" letter-spacing="-2">r</text>
  </g>

  <!-- Decorative underline -->
  <rect x="20" y="62" width="540" height="1" fill="url(#divider-grad)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="290" y="73" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#6b7280" text-anchor="middle" opacity="0.7">// find the right LLM for your hardware</text>

</svg>
